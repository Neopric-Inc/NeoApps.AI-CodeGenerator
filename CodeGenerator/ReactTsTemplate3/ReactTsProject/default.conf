server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is served from this origin (/v1/api), so the browser never sees the API host or port and the session
    # cookie stays first-party. API_UPSTREAM is filled in when the container starts (nginx templates).
    location /v1/api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # job feeds long-poll
        client_max_body_size 250m;        # document uploads
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        try_files $uri =404;
    }
}
