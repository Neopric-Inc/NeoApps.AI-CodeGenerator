server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is served from this origin (/v1/api), so the browser never sees the API host or port and the session
    # cookie stays first-party. API_UPSTREAM is filled in when the container starts (nginx templates).
    location /v1/api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # job feeds long-poll
        client_max_body_size 250m;        # document uploads
    }

    # Live rooms (WebSocket): upgrade the connection and keep it open
    location /v1/api/live/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The app's own files (schema, settings, icons) come from its API, so one built image serves any app;
    # this image's copies are the fallback (older APIs, local runs).
    location ~ ^/(?<appfile>schema\.json|ui\.config\.json|manifest\.json|icon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png|apple-touch-icon\.png|favicon-32\.png)$ {
        rewrite ^ /app-files/$appfile break;
        proxy_pass ${API_UPSTREAM};
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @static;
        add_header Cache-Control "no-cache";
    }
    location @static {
        try_files /$appfile =404;
    }

    # Page title = the app's name (APP_NAME), set when the container starts
    sub_filter '__APP_NAME__' '${APP_NAME}';
    sub_filter_once off;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Installable app: the service worker must always be fresh (it decides what is cached)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /static/ {
        expires 30d;
        try_files $uri =404;
    }
}
