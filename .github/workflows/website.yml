# Publishes website/ (neoapps.ai: index, use-cases, get-started, pricing, developers + assets/) to GitHub Pages on every
# change on main. The pages are generated by scripts/build_website.py: edit it, run it, commit both.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; custom domain neoapps.ai; Enforce HTTPS.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/build_website.py", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages match scripts/build_website.py
        run: python3 scripts/build_website.py && git diff --exit-code -- website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
